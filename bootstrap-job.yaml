apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: minio
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: ghcr.io/data-space-lab/mc:source-77f82e1-20261105@sha256:85710405ce34a482360010f85c2e22fe404c6c78399807e2519b60ddab7fe39a
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until /usr/bin/mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for MinIO"
                sleep 2
              done
              /usr/bin/mc mb --ignore-existing "local/${MINIO_BOOTSTRAP_BUCKET:-dil-data}"
          envFrom:
            - configMapRef:
                name: minio-config
            - secretRef:
                name: minio-root
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
